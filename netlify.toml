# Netlify serves the web/ folder as a static site. /api/* is proxied to the model server on the OCI VM,
# so the browser only ever talks to https (no mixed-content block) and no CORS setup is needed.
#
# The model API runs on the OCI VM (public IP below, port 8000; see deploy/setup_vm.sh).
[build]
  publish = "web"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "http://84.13.145.229:8000/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
