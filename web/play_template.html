<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beat the Model · Moment of GroundTruth</title>
<link rel="icon" type="image/png" href="/*STAMP*/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--soil:#120e0b;--soil-2:#1c1611;--line:rgba(239,232,218,.2);--paper:#eee6d6;--ink:#1b1612;--text:#f1eadc;--mute:#d0c7b5;--stamp:#d8291f;--lstm:#5fa8ad;--gru:#e3a63a;
  --f-display:'Anton','Impact','Arial Narrow',sans-serif;--f-body:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif;--f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:radial-gradient(120% 70% at 30% 0%,#2a2018,var(--soil) 65%) fixed;color:var(--text);font-family:var(--f-body);min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased;
  padding:max(1rem,env(safe-area-inset-top)) max(1rem,env(safe-area-inset-right)) max(1.4rem,env(safe-area-inset-bottom)) max(1rem,env(safe-area-inset-left))}
main{max-width:34rem;margin:0 auto}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.top{display:flex;align-items:center;gap:.7rem;margin-bottom:1rem}
.top img{width:2.6rem;height:2.6rem}
.top b{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:500}
h1{font-family:var(--f-display);font-weight:400;text-transform:uppercase;font-size:2.7rem;line-height:1;letter-spacing:.012em}
h1 em{font-style:normal;color:var(--stamp)}
.lede{color:var(--mute);line-height:1.5;margin:.9rem 0 1.4rem;font-size:1.02rem}
.lab{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.go{display:block;width:100%;font-family:var(--f-display);font-size:1.5rem;letter-spacing:.05em;text-transform:uppercase;background:var(--stamp);color:#fff;padding:.85rem 1rem;box-shadow:0 .5rem 1.4rem rgba(0,0,0,.5)}
.go:active{transform:translateY(2px)}
.dots{display:flex;gap:.4rem;margin:.2rem 0 .9rem}
.dots button{flex:1;height:.4rem;background:var(--line)}
.dots button.on{background:var(--text)}.dots button.done{background:var(--stamp)}
.paper{background:var(--paper) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/><feColorMatrix values='0 0 0 0 .3  0 0 0 0 .22  0 0 0 0 .1  0 0 0 .09 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");color:var(--ink);box-shadow:0 .8rem 2rem rgba(0,0,0,.45)}
.narr{padding:1rem 1.1rem;line-height:1.6;font-size:1rem;margin:.5rem 0 1.1rem}
.opts{display:grid;gap:.5rem}
.opt{text-align:left;border:1px solid var(--line);background:rgba(28,22,17,.8);padding:.7rem .9rem;display:block;width:100%;transition:background .15s,border-color .15s}
.opt b{display:block;font-weight:600;font-size:1rem}
.opt span{display:block;color:var(--mute);font-size:.82rem;line-height:1.35;margin-top:.15rem}
.opt:active{background:rgba(239,232,218,.12)}
.opt.sel{border-color:var(--stamp);background:rgba(216,41,31,.18);box-shadow:inset .25rem 0 0 var(--stamp)}
.opt.truth{border-color:var(--text);box-shadow:inset .25rem 0 0 var(--text)}
.tags{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.4rem}
.tag{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;padding:.12rem .45rem;border:1px solid var(--line)}
.tag.t{background:var(--text);color:var(--ink);border-color:var(--text)}.tag.m{background:var(--stamp);border-color:var(--stamp);color:#fff}.tag.y{border-color:var(--lstm);color:var(--lstm)}
.nav{display:flex;justify-content:space-between;margin-top:1rem;font-family:var(--f-mono);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.nav button{padding:.5rem .2rem;color:var(--mute)}.nav button[disabled]{opacity:.3}
.toast{position:fixed;left:1rem;right:1rem;bottom:max(1rem,env(safe-area-inset-bottom));max-width:32rem;margin:0 auto;background:var(--soil-2);border:1px solid var(--gru);padding:.7rem .9rem;font-size:.9rem;display:none}
.stampbox{margin:1.2rem 0 .4rem}
.verdict{display:inline-block;border:.3rem solid var(--stamp);color:var(--stamp);font-family:var(--f-display);font-size:2rem;text-transform:uppercase;letter-spacing:.03em;line-height:1.1;padding:.3rem .9rem .15rem;transform:rotate(-3deg);animation:slam .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes slam{from{transform:rotate(-9deg) scale(2.4);opacity:0}to{transform:rotate(-3deg) scale(1);opacity:1}}
.res{border-top:1px solid var(--line);padding:.9rem 0}
.res h3{font-family:var(--f-display);font-weight:400;font-size:1.25rem;letter-spacing:.03em;text-transform:uppercase;margin-bottom:.3rem}
.res p{color:var(--mute);font-size:.88rem;line-height:1.45}
.pulse{display:inline-block;width:.55rem;height:.55rem;border-radius:50%;background:var(--lstm);margin-right:.5rem;animation:pl 1.4s infinite}
@keyframes pl{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<div class="toast" id="toast"></div>
<script>
const ROUNDS=/*ROUNDS*/[];
const CAUSES=/*CAUSES*/[];
const API=new URLSearchParams(location.search).get('game')||'/.netlify/functions/game';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const N=ROUNDS.length;

/* a random id per phone, remembered if the browser allows it */
let mem={};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return mem[k]||null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}};
let voter=store.get('mogVoter');
if(!voter){voter=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now()).replace(/[^A-Za-z0-9-]/g,'').slice(0,36);store.set('mogVoter',voter)}

let resultsShown=false,picks=Array(N).fill(-1),epoch=0,round=0,screen='intro',revealed=false,answers=null,counts=null,pollT=0,posting=0;
try{const s=JSON.parse(store.get('mogPicks')||'null');if(s&&s.length===N){picks=s;epoch=+store.get('mogEpoch')||0}}catch(e){}
const save=()=>{store.set('mogPicks',JSON.stringify(picks));store.set('mogEpoch',String(epoch))};

async function api(action,body){
  const ac=new AbortController(),t=setTimeout(()=>ac.abort(),9000);
  try{
    const r=body?await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...body}),signal:ac.signal}):await fetch(API+'?action='+action+'&voter='+voter,{signal:ac.signal});
    return await r.json();
  }finally{clearTimeout(t)}
}
function toast(m,ms=2600){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>t.style.display='none',ms)}

const head=()=>`<div class="top"><img src="/*STAMP*/" alt=""><b>Moment of GroundTruth · audience game</b></div>`;

function intro(){
  screen='intro';
  $('#app').innerHTML=head()+`
    <h1>Can you beat the <em>model?</em></h1>
    <p class="lede">${N===1?'You will read a real pipeline incident report and tap the cause you think the investigators recorded. Our model reads the same report, and the big screen shows who got it right.':'You will read '+N+' real pipeline incident reports and tap the cause you think the investigators recorded for each one. Our model reads the same reports, and the big screen shows who got more of them right.'}</p>
    <button class="go" id="start">${picks.some(p=>p>=0)?'Continue':'Start'}</button>
    <p class="lab" style="margin-top:1rem;text-align:center">${N===1?'This takes about twenty seconds.':'This takes about a minute.'}</p>`;
  $('#start').onclick=()=>{round=Math.max(0,picks.findIndex(p=>p<0));if(revealed||picks.every(p=>p>=0))return done();play()};
}

function play(){
  screen='play';
  const r=ROUNDS[round];
  $('#app').innerHTML=head()+`
    <div class="dots" ${N===1?'hidden':''}>${ROUNDS.map((_,i)=>`<button data-i="${i}" aria-label="Report ${i+1}" class="${i===round?'on':picks[i]>=0?'done':''}"></button>`).join('')}</div>
    <p class="lab">${N===1?'What caused this incident?':'Report '+(round+1)+' of '+N+': what caused it?'}</p>
    <div class="narr paper">${esc(r.text)}</div>
    <div class="opts">${CAUSES.map((c,i)=>`<button class="opt${picks[round]===i?' sel':''}" data-i="${i}"><b>${esc(c.title)}</b><span>${esc(c.blurb)}</span></button>`).join('')}</div>
    <div class="nav"><button id="prev" ${round===0?'disabled':''}>← Back</button><button id="next">${round===N-1?(picks[round]>=0?'Done →':'Skip →'):'Skip →'}</button></div>`;
  $('#app').querySelectorAll('.dots button').forEach(b=>b.onclick=()=>{round=+b.dataset.i;play()});
  $('#app').querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.i));
  $('#prev').onclick=()=>{round--;play()};
  $('#next').onclick=()=>advance();
  scrollTo(0,0);
}
function advance(){if(round<N-1){round++;play()}else done()}

async function choose(i){
  if(revealed){toast('Voting is closed. Watch the big screen.');return}
  picks[round]=i;save();
  $('#app').querySelectorAll('.opt').forEach((b,k)=>b.classList.toggle('sel',k===i));
  const myRound=round;
  try{
    const res=await api('vote',{voter,round:myRound,choice:i});
    if(res.closed){revealed=true;toast('Voting just closed.');picks[myRound]=-1;save();return done()}
    if(!res.ok)throw new Error(res.error||'vote failed');
    if(res.epoch!==undefined&&res.epoch!==epoch){epoch=res.epoch;save()}
  }catch(e){toast('Could not reach the server. Tap your answer again.');return}
  setTimeout(()=>{if(screen==='play'&&round===myRound)advance()},380);
}

function done(){
  screen='done';clearInterval(pollT);
  const mine=picks.map((p,i)=>p>=0?`<p style="margin:.35rem 0"><span class="lab">Report ${i+1}</span><br><b>${esc(CAUSES[p].title)}</b></p>`:`<p style="margin:.35rem 0"><span class="lab">Report ${i+1}</span><br><span style="color:var(--mute)">no answer yet</span></p>`).join('');
  $('#app').innerHTML=head()+`
    <h1>Your answer is <em>in</em></h1>
    <p class="lede"><span class="pulse"></span>Watch the big screen. Your result will appear here as soon as the answer is revealed.</p>
    <div class="res"><div class="lab">Your answers</div>${mine}</div>
    <div class="nav"><button id="edit">← Change an answer</button><span></span></div>
    <div id="results"></div>`;
  $('#edit').onclick=()=>{round=Math.max(0,picks.findIndex(p=>p<0));play()};
  resultsShown=false;
  if(revealed&&answers)showResults();
  poll();pollT=setInterval(poll,3000);
}

async function poll(){
  try{
    const s=await api('state');
    if(!s.ok)return;
    if(s.epoch!==epoch){picks=s.mine.slice();epoch=s.epoch;save()}   // host reset the game: sync with the server
    revealed=s.revealed;answers=s.answers;counts=s.rounds;
    if(revealed&&answers&&screen==='done'&&!resultsShown)showResults();
    if(revealed&&screen==='play'&&!picks.every(p=>p>=0)){toast('Voting is closed.');done()}
  }catch(e){}
}

function showResults(){
  resultsShown=true;clearInterval(pollT);pollT=setInterval(poll,5000);
  let me=0,model=0,crowd=0;
  const rows=answers.map((a,i)=>{
    const c=counts[i],tot=c.total||1,share=Math.round(100*c.counts[a.truth]/tot);
    const ok=picks[i]===a.truth;if(ok)me++;if(a.model===a.truth)model++;crowd+=c.counts[a.truth]/tot;
    return `<div class="res"><h3>Report ${i+1}</h3>
      <p>The correct answer was <b style="color:var(--text)">${esc(CAUSES[a.truth].title)}</b>.</p>
      <div class="tags">
        <span class="tag ${ok?'y':''}">Your answer: ${picks[i]>=0?esc(CAUSES[picks[i]].title):'—'} ${picks[i]>=0?(ok?'✓':'✗'):''}</span>
        <span class="tag m">Model's answer: ${esc(CAUSES[a.model].title)} ${a.model===a.truth?'✓':'✗'}</span>
      </div>
      <p style="margin-top:.4rem">${share}% of the room chose the correct answer.</p></div>`;
  }).join('');
  const verdict=me>model?'You beat the model':me<model?'The model wins':answers.length===1?(me?'Both got it':'Both fooled'):'Dead heat';
  const avg=Math.round(100*crowd/answers.length);
  $('#results').innerHTML=`<div class="stampbox"><span class="verdict">${verdict}</span></div>
    <p class="lede">${answers.length===1?`Your answer was ${me?'correct':'not correct'}, and the model's answer was ${model?'correct':'not correct'}. ${avg}% of the room answered correctly.`:`You got <b style="color:var(--text)">${me} of ${answers.length}</b> right, the model got <b style="color:var(--text)">${model} of ${answers.length}</b>, and the room averaged <b style="color:var(--text)">${avg}%</b>.`}</p>${rows}`;
  scrollTo({top:$('#results').offsetTop-20,behavior:'smooth'});
}

intro();
poll();   // learns early if voting is closed or the game was reset
pollT=setInterval(poll,4000);
</script>
</body>
</html>
